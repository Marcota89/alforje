<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kit visual - galeria</title>
<link rel="stylesheet" href="../css/fonts.css"><link rel="stylesheet" href="../css/kit.css">
<style>
body{margin:0;font-family:var(--f-body);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:20px;padding:14px;justify-content:center}
.pn{width:330px;padding:14px;border-radius:20px;display:flex;flex-direction:column;gap:12px}
.pn h4{margin:0;font:400 14px var(--f-title);opacity:.85}
.line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:flex;gap:6px}.sw i{width:44px;height:44px;border-radius:10px;border:3px solid;background:#fff}
.tabsbox{position:relative;height:60px;overflow:visible;margin-top:26px}
</style></head><body>
<div class="row">
 <div class="pn" style="background:var(--sky)">
  <h4>Fundo céu</h4>
  <div class="line"><span class="k-pill">🏁 1/10</span><span class="k-pill">❤️ 3</span><span class="k-pill">🪙 120<b class="plus">+</b></span></div>
  <div class="k-seg"><span class="on">Jornada</span><span>Diário</span><span>Desafios</span><span>Seed</span></div>
  <button class="k-btn g">COMEÇAR</button><button class="k-btn o">Destaque</button>
  <div class="k-win"><div class="k-rib">ESCOLHA SEU HERÓI</div>Janela creme com texto marrom. Acentuação: ação, coração, ênfase.</div>
 </div>
 <div class="pn" style="background:var(--dusk)">
  <h4>Fundo entardecer</h4>
  <div class="line"><button class="k-btn v">Trocar</button><button class="k-btn r">LUTAR!</button><button class="k-btn ad">Anúncio</button><button class="k-btn g" disabled>Desativado</button></div>
  <div class="k-win"><div class="k-rib good">VITÓRIA!</div>Resultado da luta</div>
  <div class="k-win"><div class="k-rib bad">DERROTA</div>Resultado da luta</div>
  <div class="k-card" style="padding:10px">Cartão com borda mais fina</div>
  <div class="sw"><i style="border-color:var(--t1)"></i><i style="border-color:var(--t2)"></i><i style="border-color:var(--t3)"></i><i style="border-color:var(--t4)"></i></div>
  <div class="tabsbox k-tabs"><button class="k-tab"><span class="ti">📖</span>Codex<b class="k-dot">3</b></button><button class="k-tab"><span class="ti">📜</span>Missões</button><button class="k-tab mid on"><span class="ti">⚔️</span>Jogar</button><button class="k-tab"><span class="ti">🏆</span>Placar</button><button class="k-tab"><span class="ti">☰</span>Mais<b class="k-dot">!</b></button></div>
 </div>
</div>
</body></html>
