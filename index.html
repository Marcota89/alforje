<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Alforje</title><meta name="theme-color" content="#2c1b5e"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" type="image/png" sizes="32x32" href="icon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Alforje"><link rel="manifest" href="manifest.webmanifest"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="stylesheet" href="css/fonts.css?v=8.4"><link rel="stylesheet" href="css/kit.css?v=8.4"><link rel="stylesheet" href="css/run.css?v=8.4"><link rel="stylesheet" href="css/windows.css?v=8.4"><link rel="stylesheet" href="css/menu.css?v=8.4"></head><body>
<div class="splash" id="splash" aria-hidden="true"><div><img class="slogo" src="a/ui_logo.webp" alt="" width="720" height="388" fetchpriority="high"><small>abrindo o alforje…</small></div></div>
<div class="app" id="app">
  <header class="topbar" id="topbar">
    <div class="stats" id="stats"></div>
    <button class="petsmini" id="petsmini" aria-label="Companheiros" hidden></button>
    <button class="iconbtn" id="helpBtn" aria-label="Menu">☰</button>
  </header>
  <section class="vs k-card" id="vs"><div class="hud" id="hud"></div></section>
  <section class="arena" id="arena">
    <div class="stage"><canvas id="cv" width="480" height="250" aria-label="Arena de batalha"></canvas>
    <div class="floats" id="floats"></div></div>
  </section>
  <button class="foeinfo intent" id="foeinfo" aria-label="Intenção do inimigo"></button>
  <section class="bagzone k-card" id="bagzone">
    <div class="grid" id="bag"></div>
    <button class="aff" id="aff" data-pane="aff" aria-label="Afinidades e carga"></button>
  </section>
  <section class="base" id="base" data-mode="shop">
    <div class="shop" id="shop" data-hscroll></div>
    <div class="chestwrap k-card" id="chestwrap" hidden><div class="chesthead" id="chestHead"></div><div class="grid" id="chest"></div></div>
    <div class="meter k-card" id="meter" hidden></div>
  </section>
  <nav id="actions" aria-label="Ações"></nav>
  <div class="bubble" id="mline" role="status" hidden></div>
</div>
<section class="menu" id="menu" hidden aria-label="Menu">
  <header class="mtop" id="mtop"></header>
  <main class="mpage" id="mpage" tabindex="-1"></main>
  <nav class="k-tabs" id="mtabs" aria-label="Abas">
    <button class="k-tab" data-nav="equip"><span class="ti" aria-hidden="true">🛡️</span>Equipar</button>
    <button class="k-tab" data-nav="pets"><span class="ti" aria-hidden="true">🐾</span>Pets</button>
    <button class="k-tab mid" data-nav="jogar"><span class="ti" aria-hidden="true">⚔️</span>Jogar</button>
    <button class="k-tab" data-nav="diario"><span class="ti" aria-hidden="true"><img class="ri-ico" src="a/ui_chest3.webp" alt=""></span>Prêmios</button>
    <button class="k-tab" data-nav="loja"><span class="ti" aria-hidden="true">🛒</span>Loja</button>
  </nav>
</section>
<aside class="drawer k-win" id="drawer" hidden aria-label="Gaveta">
  <div class="dhead"><b class="k-rib" id="dtitle"></b><button class="iconbtn" id="dclose" aria-label="Fechar gaveta">✕</button></div>
  <div class="dbody">
    <div class="dpane" data-pane="pets"><div class="pets" id="pets"></div><p class="muted small center">Companheiros lutam ao seu lado. Toque num deles para usar a habilidade ou vender.</p></div>
    <div class="dpane" data-pane="mascate" hidden><div class="scene"><img src="a/shopscene.webp" alt="A barraca do Mascate Brás"></div><p id="mlineFull"></p><div class="two"><button class="k-btn v" id="recipesBtn">Receitas</button><button class="k-btn v" id="oddsBtn">Chances da loja</button></div></div>
    <div class="dpane" data-pane="aff" hidden><div id="affFull"></div></div>
    <div class="dpane" data-pane="more" hidden><div class="morelist" id="moreList"></div></div>
  </div>
</aside>
<div class="coach" id="coach" hidden><div class="hole"></div><div class="cbub k-card"><small></small><p></p><div class="cb2"><button class="k-btn v" id="coachSkip">Pular tutorial</button><button class="k-btn g" id="coachOk" hidden>Entendi</button></div></div></div>
<div class="pop k-card" id="pop" hidden role="dialog" aria-label="Ficha do item"></div>
<div class="sellzone" id="sellzone" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="Ficha completa do item"></div>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<div class="rotmsg" id="rotmsg"><div class="k-card"><b>⟲</b><p>Gire o celular para retrato</p><span>O Alforje foi feito para jogar com o celular em pé.</span></div></div>

<script src="js/config.js?v=8.4" charset="utf-8"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" charset="utf-8"></script>
<script src="js/data.js?v=8.4" charset="utf-8"></script>
<script src="js/sim.js?v=8.4" charset="utf-8"></script>
<script src="js/meta.js?v=8.4" charset="utf-8"></script>
<script src="js/save.js?v=8.4" charset="utf-8"></script>
<script src="js/cloud.js?v=8.4" charset="utf-8"></script>
<script src="js/main.js?v=8.4" charset="utf-8"></script>
</body></html>
