html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.35;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
 background:radial-gradient(120% 60% at 50% 0%,#3a2010 0%,transparent 60%),radial-gradient(80% 40% at 50% 100%,#2a1208 0%,transparent 70%),var(--bg)}
.app{max-width:470px;margin:0 auto;display:grid;gap:12px}
button{font:inherit;color:inherit}
button:focus-visible,.item:focus-visible,.card:focus-visible,.slot:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* wooden frame with iron corners (9-slice) */
.framed{border:12px solid transparent;border-image:var(--frame) 16 / 12px round;background:linear-gradient(180deg,#3d2514,#2b190c);background-clip:padding-box;position:relative}
.plaque{font-family:var(--f-title);font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#f6e2b4;text-shadow:0 2px 0 #1a0c04;
 background:linear-gradient(#7a4d29,#4d2e17);padding:4px 18px 3px;font-size:15px;white-space:nowrap;display:inline-block;
 clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);position:relative}
.plaquewrap{display:inline-block;padding:2px;background:linear-gradient(#b8bec8,#5d636d);clip-path:polygon(11px 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,11px 100%,0 50%);filter:drop-shadow(0 3px 0 #000)}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:-26px;margin-bottom:8px}
.panelhead .note{font-family:var(--f-num);font-size:11px;color:var(--muted);text-align:right;background:#1a0f07;padding:1px 7px;border-radius:4px;box-shadow:0 0 0 1px #4a2e19}
.panelhead .note.over{color:var(--red)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.logo .plaque{font-size:22px;padding:5px 22px 4px;color:var(--gold)}
.stats{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--f-num);font-size:13px;display:inline-flex;align-items:center;gap:4px;background:linear-gradient(#3a2414,#24150b);border:2px solid #120a05;box-shadow:inset 0 0 0 1px #6b4428;padding:2px 7px;font-variant-numeric:tabular-nums;white-space:nowrap;border-radius:4px}
.chip img{height:13px;width:auto;image-rendering:pixelated}
.chip.gold{color:var(--gold)}
.icon-btn{width:30px;height:30px;background:linear-gradient(#4b525d,#2c3038);border:2px solid #0d0f12;box-shadow:inset 0 0 0 1px #8b929d;border-radius:50%;cursor:pointer;font-family:var(--f-title);font-weight:900;font-size:13px;padding:0;display:grid;place-items:center;color:var(--ink)}

/* arena */
.arena{position:relative;overflow:hidden;background:#000;border:3px solid #0d0805;box-shadow:0 0 0 3px #6b4428,0 0 0 5px #120a05,0 6px 0 5px #000;border-radius:3px}
.arena canvas{display:block;width:100%;height:auto}
.stage{position:relative}
.hud{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;gap:6px;padding:7px 9px;pointer-events:none;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.side{display:grid;gap:3px;min-width:0}
.side.e{justify-items:end;text-align:right}
.fname{font-family:var(--f-title);font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-shadow:0 2px 0 #000}
.fname em{font-style:normal;color:var(--gold);font-size:11px}
.bar{width:100%;max-width:160px;height:12px;background:#1a0b0b;border:2px solid #0a0505;box-shadow:0 0 0 1px #6b4428;position:relative;border-radius:2px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#ff7a68,#c22d22 60%,#8e1a14);transition:width .15s}
.bar b{position:absolute;left:0;right:auto;bottom:0;height:4px;background:linear-gradient(#a8dcff,#3d8fe0)}
.side.e .bar i,.side.e .bar b{left:auto;right:0}
.hpt{font-family:var(--f-num);font-size:11px;font-variant-numeric:tabular-nums;color:#f0e2c6;text-shadow:1px 1px 0 #000}
.tags{display:flex;gap:3px;flex-wrap:wrap}
.side.e .tags{justify-content:flex-end}
.tag{font-family:var(--f-num);font-size:10px;padding:0 4px;background:rgba(0,0,0,.65);border:1px solid currentColor;border-radius:3px;white-space:nowrap}
.tag.blk{color:#8cc8ff} .tag.heal{color:var(--green)} .tag.ref{color:#d9a0f0} .tag.dps{color:var(--gold)} .tag.elite{color:#ff8a6a} .tag.over{color:var(--red)} .tag.load{color:#e6d6b8}
.mid{align-self:start;text-align:center;font-family:var(--f-num);font-size:10px;color:#e9dcc4;text-shadow:1px 1px 0 #000}
.mid strong{display:block;font-family:var(--f-title);font-weight:900;font-size:22px;color:var(--gold);text-shadow:0 2px 0 #000,0 0 10px rgba(242,193,78,.5)}
.mid .fat{color:var(--red)}
.floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;font-family:var(--f-num);font-weight:700;font-size:15px;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;transform:translateX(-50%);animation:up .9s ease-out forwards;white-space:nowrap}
.float.crit{font-family:var(--f-title);font-weight:900;font-size:18px;color:var(--gold)}
.float.dmg{color:#fff} .float.burn{color:var(--ember)} .float.psn{color:var(--poison)} .float.heal{color:var(--green)} .float.blk{color:#8cc8ff}
.float.banner{font-family:var(--f-title);font-weight:900;font-size:16px;color:var(--gold);animation:banner 1.2s ease-out forwards}
.foeinfo{display:grid;gap:3px;padding:8px 10px;background:linear-gradient(#2a190d,#1c1009);border-top:3px solid #0d0805;font-size:14px;color:var(--muted)}
.foeinfo .intent{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.foeinfo .intent b{font-family:var(--f-title);font-weight:900;font-size:11px;letter-spacing:.06em;color:#ff9a7a}
.foeinfo q{color:var(--ink);font-style:italic}
.foeinfo .rr{color:var(--gold);font-weight:700}

/* live meter */
.meter{display:grid;gap:4px;padding:8px 10px 10px;background:#140c07;border-top:3px solid #0d0805}
.meter h5{margin:0;font-family:var(--f-title);font-size:11px;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.mrow{display:grid;grid-template-columns:22px minmax(0,6.5em) 1fr auto;gap:6px;align-items:center;font-size:13px}
.mrow img{max-width:22px;max-height:22px;width:auto;height:auto;justify-self:center}
.mrow img.px{image-rendering:pixelated}
.mrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar{display:flex;height:8px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.mbar i{display:block;height:100%}
.mbar .d{background:var(--gold)} .mbar .b{background:var(--blue)} .mbar .h{background:var(--green)}
.mrow b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500;font-size:12px;white-space:nowrap}
.mrow b em{font-style:normal;color:var(--blue)} .mrow b u{text-decoration:none;color:var(--green)}

/* panels */
.panel{display:grid;gap:8px;padding:6px 4px 4px}
.pets{display:flex;gap:8px;justify-content:center}
.slot{width:58px;height:58px;background:radial-gradient(circle at 50% 40%,#2c1c10,var(--slot));border:2px solid #0d0805;box-shadow:inset 0 3px 6px #000,inset 0 0 0 2px var(--slot-edge);border-radius:4px;display:grid;place-items:center;position:relative;cursor:pointer;padding:0}
.slot.full{box-shadow:inset 0 3px 6px #000,inset 0 0 0 2px var(--tier),0 0 10px rgba(242,193,78,.25)}
.slot img{max-width:48px;max-height:44px;animation:bob 1.6s ease-in-out infinite}
.slot.sel{outline:2px solid var(--gold);outline-offset:2px}
.slot.fire{animation:jump .22s ease-out}
.slot .pp{position:absolute;left:4px;top:4px;display:flex;gap:2px}
.slot .pp i{width:4px;height:4px;background:var(--tier);box-shadow:1px 1px 0 #000}

.grid{position:relative;margin:0 auto;width:calc(var(--cols)*var(--cs));height:calc(var(--rows)*var(--cs));z-index:1;touch-action:none}
.cell{position:absolute;width:calc(var(--cs) - 4px);height:calc(var(--cs) - 4px);margin:2px;left:calc(var(--x)*var(--cs));top:calc(var(--y)*var(--cs));
 background:radial-gradient(circle at 50% 35%,#2c1b0f,var(--slot));border:2px solid #0b0603;box-shadow:inset 0 3px 6px rgba(0,0,0,.85),inset 0 0 0 2px var(--slot-edge);border-radius:4px;pointer-events:none}
#bag .cell.top{box-shadow:inset 0 3px 6px rgba(0,0,0,.85),inset 0 0 0 2px #6a5a3a}
#bag .cell.bottom{box-shadow:inset 0 3px 6px rgba(0,0,0,.85),inset 0 0 0 2px #4a5a3a}
.teth{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:7;overflow:visible}
.teth line{stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 3px currentColor)}
.teth line.syn{stroke:#8ff09a;color:#6cc070;stroke-dasharray:7 5;animation:dash .6s linear infinite}
.teth line.rcp{stroke:#ffd76a;color:#f2c14e;stroke-dasharray:7 5;animation:dash .6s linear infinite}
.teth line.flash{stroke:#fff3c4;color:#ffd76a;animation:fade .28s ease-out forwards}
.teth circle{fill:#000;stroke-width:2}
.item{position:absolute;left:calc(var(--x)*var(--cs));top:calc(var(--y)*var(--cs));width:calc(var(--w)*var(--cs));height:calc(var(--h)*var(--cs));padding:3px;touch-action:none;cursor:grab;z-index:2}
.face{width:100%;height:100%;display:grid;place-items:center;position:relative;border-radius:5px;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.06),transparent 70%)}
.face>*{grid-area:1/1}
.face.t2{box-shadow:inset 0 0 0 2px rgba(74,168,255,.85),0 0 10px rgba(74,168,255,.45);background:radial-gradient(circle at 50% 45%,rgba(74,168,255,.18),transparent 70%)}
.face.t3{box-shadow:inset 0 0 0 2px rgba(180,98,255,.9),0 0 12px rgba(180,98,255,.5);background:radial-gradient(circle at 50% 45%,rgba(180,98,255,.22),transparent 70%)}
.face.t4{box-shadow:inset 0 0 0 2px var(--t4),0 0 14px rgba(255,194,58,.65);background:radial-gradient(circle at 50% 45%,rgba(255,194,58,.22),transparent 70%)}
.face.t4::before{content:"";position:absolute;inset:0;border-radius:5px;padding:2px;background:conic-gradient(from var(--ang,0deg),#ffe27a,#ff6ad5,#6affd0,#94d0ff,#ffe27a);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 3s linear infinite;pointer-events:none}
.face img.art{pointer-events:none;height:auto;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.55))}
.face img.art.bowtint{filter:sepia(.9) saturate(1.8) hue-rotate(-12deg) brightness(.9) drop-shadow(2px 3px 0 rgba(0,0,0,.55))}
.foil{pointer-events:none;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;background-size:300% 300%;animation:foil 2.6s linear infinite;mix-blend-mode:screen}
.foil.t2{background-image:linear-gradient(115deg,transparent 40%,rgba(140,200,255,.6) 50%,transparent 60%);animation-duration:3.6s}
.foil.t3{background-image:linear-gradient(115deg,#ff6ad5,#c774e8,#ad8cff,#8795e8,#94d0ff,#6affd0,#ff6ad5);opacity:.45;mix-blend-mode:overlay}
.foil.t4{background-image:linear-gradient(115deg,transparent 30%,rgba(255,240,170,.9) 45%,rgba(255,200,60,.6) 50%,transparent 65%);animation-duration:2s}
.twinkle{position:absolute;width:4px;height:4px;background:#fff6c8;box-shadow:0 0 6px #ffd060;animation:twinkle 1.6s steps(4) infinite;pointer-events:none;z-index:3}
.pips{position:absolute;left:4px;top:4px;display:flex;gap:2px;z-index:3}
.pips i{width:5px;height:5px;background:var(--tier);box-shadow:1px 1px 0 #000;border-radius:1px}
.awk{position:absolute;right:4px;top:1px;font-size:11px;color:var(--tier);text-shadow:1px 1px 0 #000;z-index:3}
.zoneoff{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.55) 0 4px,transparent 4px 8px);z-index:2;border-radius:5px}
.cdr{position:absolute;inset:0;pointer-events:none;border-radius:5px;background:conic-gradient(rgba(255,226,122,.32) calc(var(--cdp,0)*1turn),transparent 0);z-index:1}
.item.sel .face{outline:2px solid var(--gold);outline-offset:-2px}
.item.syn .face{box-shadow:inset 0 0 0 2px #8ff09a,0 0 14px rgba(108,192,112,.85);animation:glow .7s steps(2) infinite}
.item.rgl .face{box-shadow:inset 0 0 0 3px #ffd76a,0 0 18px rgba(242,193,78,.95);animation:glow .5s steps(2) infinite}
.item.rcpready .face::after{content:"FORJA!";position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-family:var(--f-title);font-weight:900;font-size:8px;letter-spacing:.05em;color:#2a1606;background:linear-gradient(#ffe08a,#d39a2e);padding:0 4px;border-radius:2px;box-shadow:0 1px 0 #000;z-index:4}
.item.dragging{opacity:.25}
.item.fire .face{animation:jump .22s ease-out}
.item.buff .face{animation:buff .25s steps(2)}
.item.merged .face{animation:merged .7s steps(4)}
.preview{position:absolute;pointer-events:none;border:2px solid var(--green);background:rgba(108,192,112,.22);z-index:5;border-radius:5px}
.preview.bad{border-color:var(--red);background:rgba(224,87,74,.22)}
.preview.merge{border-color:var(--gold);background:rgba(242,193,78,.3)}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:60;padding:3px}
.ghost .face{background:rgba(30,18,10,.7)}
.tip{position:fixed;left:0;top:0;z-index:61;pointer-events:none;background:linear-gradient(#2c1a0d,#1a0f07);border:2px solid var(--gold-d);box-shadow:0 0 0 2px #000,0 6px 0 #000;padding:6px 9px;font-size:13px;max-width:240px;display:grid;gap:2px;border-radius:4px}
.tip b{font-family:var(--f-title);color:var(--gold);font-weight:700}
.tip .g{color:#8ff09a} .tip .r{color:var(--red)} .tip .o{color:var(--gold)}
.spark{position:absolute;width:6px;height:6px;background:var(--gold);pointer-events:none;z-index:6;animation:spark .6s ease-out forwards}

/* merchant stall */
.scene{position:relative;margin:-2px -2px 4px;border:3px solid #0d0805;border-radius:3px;overflow:hidden;aspect-ratio:900/172;max-width:100%}
.scene img{display:block;width:100%;height:100%;object-fit:cover}
.scene .sign{position:absolute;left:50%;top:6px;transform:translateX(-50%)}
.scene .sign .plaque{font-size:13px}
.say{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center}
.say img{width:44px;height:44px;object-fit:cover;object-position:50% 30%;border:2px solid #0d0805;box-shadow:0 0 0 2px #6b4428;border-radius:50%}
.say p{margin:0;background:linear-gradient(#f2dfb6,#dcc08c);color:#2a1606;border:2px solid #120a05;padding:5px 9px;font-size:14px;border-radius:6px;position:relative}
.say p::before{content:"";position:absolute;left:-8px;top:12px;border:6px solid transparent;border-right-color:#120a05}
.say b{font-family:var(--f-title);font-weight:900;font-size:12px}
.shop{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.card{position:relative;display:grid;justify-items:center;gap:5px;padding:0;background:none;border:0;cursor:grab;touch-action:none;min-width:0}
.card .box{width:100%;aspect-ratio:1;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#3a2414,#1a0f07);border:3px solid #6b4428;box-shadow:0 0 0 2px #0d0805,inset 0 0 0 2px #0d0805,inset 0 4px 8px #000;border-radius:4px;position:relative}
.card .box img{max-width:82%;max-height:82%;width:auto;height:auto;pointer-events:none;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.6))}
.card .box img.bowtint{filter:sepia(.9) saturate(1.8) hue-rotate(-12deg) brightness(.9) drop-shadow(2px 3px 0 rgba(0,0,0,.6))}
.card.t2 .box{border-color:#3a7ac0;box-shadow:0 0 0 2px #0d0805,inset 0 0 0 2px #0d0805,0 0 10px rgba(74,168,255,.6)}
.card.t3 .box{border-color:#8a4ad0;box-shadow:0 0 0 2px #0d0805,inset 0 0 0 2px #0d0805,0 0 12px rgba(180,98,255,.6)}
.card.t4 .box{border-color:#e0a83a;box-shadow:0 0 0 2px #0d0805,inset 0 0 0 2px #0d0805,0 0 14px rgba(255,194,58,.7)}
.card .price{font-family:var(--f-num);font-size:13px;display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums;background:linear-gradient(#5a3820,#3a2312);border:2px solid #0d0805;box-shadow:inset 0 0 0 1px #8b5e34;border-radius:10px;padding:0 7px;color:#f6e2b4}
.card .price img{height:11px;image-rendering:pixelated}
.card .kind{position:absolute;left:3px;bottom:2px;font-family:var(--f-num);font-size:9px;color:var(--muted);text-shadow:1px 1px 0 #000}
.card.poor .price{color:var(--red)}
.card.sold{visibility:hidden}
.card.sel .box{outline:2px solid var(--gold);outline-offset:2px}
.card .lock{position:absolute;right:3px;top:3px;width:12px;image-rendering:pixelated}
.sellnote{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-title);font-weight:900;font-size:18px;color:var(--gold);text-shadow:0 2px 0 #000;pointer-events:none;z-index:9;background:rgba(80,20,10,.55)}

.actions{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;margin-top:4px}
.btn{background:linear-gradient(#545b66,#2f343c);border:2px solid #0d0f12;box-shadow:inset 0 0 0 2px #8e95a0,inset 0 -5px 0 rgba(0,0,0,.35),0 4px 0 #000;padding:9px 6px;font-family:var(--f-title);font-weight:900;font-size:13px;letter-spacing:.04em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;line-height:1.1;text-align:center;border-radius:5px;color:var(--ink);text-shadow:0 2px 0 #000}
.btn:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px #8e95a0,0 1px 0 #000}
.btn.primary{background:linear-gradient(#e2a43c,#9a5c14);box-shadow:inset 0 0 0 2px #ffe08a,inset 0 -5px 0 rgba(0,0,0,.3),0 4px 0 #000;color:#fff6e0;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn img{height:12px;image-rendering:pixelated}
.btn .n{font-family:var(--f-num);font-weight:500}
.speed{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn.on{background:linear-gradient(#f2dfb6,#c9a66a);color:#2a1606;text-shadow:none}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.sheet .in{pointer-events:auto;max-width:470px;margin:0 auto;display:grid;gap:8px;max-height:60vh;overflow:auto;padding:4px 6px 6px}
.sheet h3{margin:0;font-family:var(--f-title);font-weight:900;font-size:18px;display:flex;gap:10px;align-items:center}
.sheet h3 .ic{width:46px;height:46px;display:grid;place-items:center;flex:none}
.sheet h3 img{max-width:46px;max-height:46px}
.sheet h3 img.bowtint{filter:sepia(.9) saturate(1.8) hue-rotate(-12deg) brightness(.9)}
.tiername{font-family:var(--f-num);font-size:12px;color:var(--tier)}
.sheet ul{margin:0;padding-left:18px;display:grid;gap:3px}
.sheet ul li::marker{color:var(--gold)}
.bonus{color:var(--gold)} .awkl{color:#c891ff} .warn{color:var(--red)}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .row .btn{flex:1 1 80px}
.overlay{position:fixed;inset:0;z-index:70;background:rgba(10,6,3,.86);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-left,0px)) 16px max(16px,env(safe-area-inset-right,0px));overflow:auto}
.modal{width:100%;max-width:450px;display:grid;gap:12px;max-height:calc(100dvh - 32px);overflow:auto;padding:6px 8px 8px}
.modal h2{margin:0;font-family:var(--f-title);font-weight:900;font-size:28px;color:var(--gold);text-shadow:0 3px 0 #000;text-wrap:balance;text-align:center}
.modal h2.bad{color:var(--red)}
.modal h4{margin:0;font-family:var(--f-title);font-size:14px;color:var(--muted);letter-spacing:.05em}
.modal p{margin:0}
.modal .story{font-size:16px;line-height:1.5;color:#efe0c2;border-left:3px solid var(--gold);padding-left:10px;font-style:italic}
.modal .muted{color:var(--muted);font-size:14px}
.classes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rewards{display:grid;gap:8px}
.cls{display:grid;justify-items:center;gap:4px;text-align:center;background:radial-gradient(circle at 50% 30%,#3a2414,#1a0f07);border:3px solid #6b4428;box-shadow:0 0 0 2px #0d0805,0 4px 0 #000;padding:8px 6px;cursor:pointer;border-radius:5px}
.cls .por{height:96px;display:grid;place-items:end center}
.cls .por img{max-height:96px;max-width:100%}
.cls b{font-family:var(--f-title);font-weight:900;font-size:15px;display:block}
.cls span{font-size:12.5px;color:var(--muted);display:block;line-height:1.3}
.cls:hover:not(:disabled){border-color:var(--gold)}
.cls:disabled{opacity:.45;cursor:not-allowed}
.rewards .cls{grid-template-columns:64px minmax(0,1fr);justify-items:start;text-align:left;align-items:center}
.rewards .cls img{max-width:60px;max-height:60px;justify-self:center}
.rewards .cls img.bowtint{filter:sepia(.9) saturate(1.8) hue-rotate(-12deg) brightness(.9)}
details.howto-wrap summary{cursor:pointer;color:var(--gold);font-family:var(--f-title);font-weight:700}
.howto{display:grid;gap:4px;font-size:14px;color:var(--muted);margin:6px 0 0;padding-left:18px}
.howto b{color:var(--ink)}
.recipes{display:grid;gap:5px;font-size:14px}
.recipes div{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.recipes img{height:24px;width:auto}
.forge{display:grid;gap:4px;padding:8px 10px;background:#0d0805;border:2px solid var(--gold);font-size:14px;border-radius:4px}
.forge b{font-family:var(--f-title);color:var(--gold)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;background:linear-gradient(#2c1a0d,#1a0f07);color:var(--ink);border:2px solid var(--gold);padding:6px 14px;font-size:15px;max-width:calc(100% - 32px);text-align:center;border-radius:5px;box-shadow:0 4px 0 #000}

@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
@keyframes bob{50%{translate:0 -3px}}
@keyframes up{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-42px);opacity:0}}
@keyframes banner{0%{transform:translate(-50%,6px) scale(.6);opacity:0}20%{transform:translate(-50%,0) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-14px);opacity:0}}
@keyframes jump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-6px) scale(1.08,.94);filter:brightness(1.6)}100%{transform:none;filter:none}}
@keyframes buff{0%{filter:brightness(2) saturate(1.5)}100%{filter:none}}
@keyframes merged{0%,50%{filter:brightness(2.4)}100%{filter:none}}
@keyframes foil{0%{background-position:100% 50%}100%{background-position:-100% 50%}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.4)}}
@keyframes glow{50%{filter:brightness(1.35)}}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes fade{to{opacity:0}}
@keyframes spark{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
@media (prefers-reduced-motion:reduce){.slot img,.item.fire .face,.item.merged .face,.foil,.twinkle,.teth line,.item.syn .face,.item.rgl .face,.face.t4::before{animation:none!important}.float{animation-duration:.01s}}

/* ===== v6 additions ===== */
.chip.asc{color:#c891ff}.chip.mode{color:#8fe3ff}
.small{font-size:13px}.center{text-align:center}.muted{color:var(--muted)}
.modtag{font-family:var(--f-title);font-weight:700;font-size:12px;color:#2a1606;background:linear-gradient(#ffb08a,#d0603a);padding:0 6px;border-radius:3px}
details.ars summary{cursor:pointer;color:var(--gold);font-size:14px}
.arsenal{margin:4px 0 0;padding-left:18px;display:grid;gap:2px;font-size:14px;color:var(--ink)}
.arsenal li.mod{color:#ffb08a}.arsenal li.mod i{color:var(--muted)}
.tdots{position:absolute;right:4px;bottom:3px;display:flex;gap:2px;z-index:3}
.tdots i{width:6px;height:6px;border-radius:50%;box-shadow:0 0 0 1px #000}
.card .tdots{right:5px;bottom:5px}
.nf{position:absolute;left:4px;bottom:1px;font-size:12px;color:var(--red);text-shadow:1px 1px 0 #000;z-index:3}
.cell.pk{box-shadow:inset 0 3px 6px rgba(0,0,0,.85),inset 0 0 0 2px var(--pk);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--pk) 22%,#2c1b0f),var(--slot))}
.cell b{position:absolute;left:3px;top:1px;font-family:var(--f-num);font-weight:500;font-size:10px;color:var(--pk);text-shadow:1px 1px 0 #000}
.aff{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;min-height:20px}
.aftag{font-family:var(--f-num);font-size:12px;padding:1px 7px;border-radius:10px;border:1px solid var(--c);color:var(--c);background:rgba(0,0,0,.35)}
.aftag.on{background:var(--c);color:#1a0f07;font-weight:700;box-shadow:0 0 8px var(--c)}
.slot .ch{position:absolute;right:3px;bottom:2px;font-family:var(--f-num);font-size:11px;color:var(--gold);text-shadow:1px 1px 0 #000}
.card .sale{position:absolute;left:-3px;top:-3px;font-family:var(--f-title);font-weight:900;font-size:9px;background:var(--red);color:#fff;padding:0 4px;border-radius:2px;z-index:2;box-shadow:0 1px 0 #000}
.card .price.off{color:#8ff09a}
.shop{grid-template-columns:repeat(var(--n,5),minmax(0,1fr))}
.actions2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn.sm{font-size:12px;padding:6px 8px;flex:1 1 auto}
.btn.gold{background:linear-gradient(#8a6a2a,#5a3e14);box-shadow:inset 0 0 0 2px #f2c14e,inset 0 -5px 0 rgba(0,0,0,.3),0 4px 0 #000}
#shopwrap.mini .scene,#shopwrap.mini .say{display:none}
#shopwrap.mini .shop{grid-template-columns:repeat(var(--n,5),minmax(0,1fr));}
#shopwrap.mini .card .box{aspect-ratio:auto;height:44px}
.shophead{display:flex;justify-content:flex-end;margin-top:-6px}
.shape{display:grid;gap:1px;justify-self:center}
.shape i{width:8px;height:8px;background:#5a3a20}.shape i.n{background:var(--pk)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;color:var(--muted)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.modes{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.mtab{font-family:var(--f-title);font-weight:700;font-size:13px;background:#1a0f07;border:2px solid #6b4428;color:var(--muted);padding:5px 10px;border-radius:14px;cursor:pointer}
.mtab.on{background:linear-gradient(#e2a43c,#9a5c14);color:#fff6e0;border-color:#ffe08a}
.chals{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chal{display:grid;gap:2px;text-align:left;background:#1a0f07;border:2px solid #6b4428;border-radius:5px;padding:6px 8px;cursor:pointer;color:var(--ink)}
.chal span{font-size:13px;color:var(--muted)}.chal.on{border-color:var(--gold);box-shadow:0 0 8px rgba(242,193,78,.5)}.chal:disabled{opacity:.45}
.fld{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.fld input,.fld textarea{font:inherit;font-size:15px;color:var(--ink);background:#1a0f07;border:2px solid #6b4428;border-radius:4px;padding:6px 8px;-webkit-user-select:text;user-select:text;width:100%}
.clswrap{display:grid;gap:4px;align-content:start}
.ascrow,.kitrow{display:flex;gap:4px;align-items:center;justify-content:center;font-size:13px;flex-wrap:wrap}
.mini{font:inherit;font-size:12px;background:#1a0f07;border:1px solid #6b4428;color:var(--ink);border-radius:4px;padding:2px 7px;cursor:pointer;min-height:28px}
.mini.on{border-color:var(--gold);color:var(--gold)}.mini:disabled{opacity:.4;cursor:not-allowed}
.cls .por{position:relative}
.sticker{position:absolute;right:-4px;top:2px;font-family:var(--f-title);font-weight:900;font-size:12px;color:#2a1606;background:radial-gradient(#ffe08a,#c88a2a);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;box-shadow:0 0 0 2px #0d0805,0 0 10px rgba(242,193,78,.7);transform:rotate(-12deg)}
.cls .subs{color:#c891ff!important;font-size:12.5px}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:#5a3a20}.dots i.on{background:var(--gold)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.ccell{display:grid;justify-items:center;gap:2px;text-align:center;background:#1a0f07;border:1px solid #4a2e19;border-radius:4px;padding:5px 3px;position:relative;font-size:12.5px}
.ccell img{height:40px;width:auto;max-width:80px}.ccell span{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.ccell .tdots{position:static}
img.sil{filter:brightness(0) drop-shadow(0 0 1px #6b4428)!important;opacity:.7}
.achs{display:grid;gap:5px}.achv{display:grid;padding:5px 8px;background:#1a0f07;border-left:3px solid #4a2e19;border-radius:3px;font-size:14px}
.achv span{color:var(--muted);font-size:13px}.achv.on{border-left-color:var(--gold)}.achv.on b{color:var(--gold)}
.hist{display:grid;gap:8px}.hrow{display:grid;gap:4px;padding:6px 8px;background:#1a0f07;border:1px solid #4a2e19;border-radius:4px;font-size:14px}
.hrow>div:first-child{display:grid}
.mini-build{display:flex;flex-wrap:wrap;gap:3px}.mini-build img{height:22px;width:auto;max-width:28px;filter:drop-shadow(0 0 2px var(--tier))}
.rotfab{position:fixed;right:16px;top:calc(40% - 30px);z-index:65;font-family:var(--f-title);font-weight:900;font-size:16px;padding:14px 16px;border-radius:30px;background:linear-gradient(#e2a43c,#9a5c14);border:2px solid #0d0805;box-shadow:inset 0 0 0 2px #ffe08a,0 4px 0 #000;color:#fff6e0;touch-action:none}
.why{display:block;color:#8ff09a;font-size:14px}
.recipes .cat{color:var(--muted);font-size:13px}
table.st{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.st th{font-family:var(--f-title);font-size:11px;color:var(--muted);text-align:right;padding:3px 4px;border-bottom:1px solid #4a2e19;font-weight:700}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st td{padding:3px 4px;text-align:right;border-bottom:1px solid #2a1a0d;white-space:nowrap}
table.st td:first-child{display:flex;gap:5px;align-items:center;max-width:9.5em;overflow:hidden}
table.st td:first-child span{overflow:hidden;text-overflow:ellipsis}
table.st td img{max-width:20px;max-height:20px;flex:none}table.st td img.px{image-rendering:pixelated}
table.st em{font-style:normal;color:var(--blue)}table.st u{text-decoration:none;color:var(--green)}
table.st .sb{color:var(--ember)}table.st .sp{color:var(--poison)}table.st .sf{color:#8fe3ff}
table.odds td,table.odds th{text-align:center}table.odds tr.cur td{background:rgba(242,193,78,.15);color:var(--gold)}
.tabs{display:flex;gap:4px}.tab{flex:1;font-family:var(--f-title);font-weight:700;font-size:13px;background:#1a0f07;border:2px solid #4a2e19;color:var(--muted);padding:5px;border-radius:4px 4px 0 0;cursor:pointer}
.tab.on{color:var(--gold);border-color:var(--gold-d)}

/* UX-07: typography floor */
.tag{font-size:12px}.hpt{font-size:12px}.panelhead .note{font-size:12.5px}.cls span{font-size:13.5px}.mrow{font-size:14px}.foeinfo{font-size:14.5px}
.sheet ul{font-size:15px}.howto{font-size:14.5px}.recipes{font-size:14.5px}

.pkleg{flex-basis:100%;text-align:center;font-size:13px;color:var(--c)}
.rewards .cls img.px{width:30px;height:auto;image-rendering:pixelated}
table.st small.cr{color:var(--gold);font-size:11px}
table.st .sb,table.st .sp,table.st .sf{white-space:nowrap}
.stats{gap:4px}.chip{padding:2px 5px;font-size:12.5px}.icon-btn{width:28px;height:28px}

/* ===== Plano mobile (fases 0–3): tela única em retrato, sem rolagem da página ===== */
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{padding:0;touch-action:manipulation;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-size:15px}
body.big{font-size:17px}
body.big .pop ul,body.big .sheet ul{font-size:16.5px}body.big .foeinfo{font-size:15.5px}body.big .aftag,body.big .load{font-size:13.5px}
.app{position:relative;max-width:480px;width:100%;margin:0 auto;height:100vh;height:100svh;display:flex;flex-direction:column;gap:4px;overflow:hidden;
 padding:env(safe-area-inset-top,0px) max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px));box-sizing:border-box}
.app>*{flex:none;min-width:0}
/* topo 48 */
.topbar{height:48px;display:flex;align-items:center;gap:6px;padding:0 8px;background:linear-gradient(#2a190d,#1a0f07);border-bottom:3px solid #0d0805;box-shadow:0 2px 0 #6b4428}
.topbar .stats{flex:1;display:flex;gap:4px;align-items:center;flex-wrap:nowrap;overflow:hidden;min-width:0}
.topbar .chip{white-space:nowrap;font-size:13px;padding:3px 6px;display:inline-flex;align-items:center;gap:3px}
.topbar .chip img{height:13px}
.topbar .chip small{font-size:10.5px;color:var(--green);margin-left:2px}
.iconbtn{min-width:44px;height:44px;display:grid;place-items:center;font-size:20px;color:var(--ink);background:linear-gradient(#4a2e19,#2c190d);border:2px solid #0d0805;box-shadow:inset 0 0 0 1px #7b5030;border-radius:6px;cursor:pointer;padding:0}
.petsmini{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;gap:1px;padding:0 4px;background:linear-gradient(#3a2414,#1a0f07);border:2px solid #0d0805;box-shadow:inset 0 0 0 1px #7b5030;border-radius:6px;cursor:pointer}
.petsmini img{width:22px;height:22px;object-fit:contain;filter:drop-shadow(0 0 2px var(--tier))}
.petsmini i{width:10px;height:10px;border-radius:50%;border:1px dashed #6b4428;margin:0 3px}
/* arena elástica */
.arena{height:var(--arenah,140px);box-shadow:none;border-width:2px 0;border-radius:0;flex:none}
.arena .stage{height:100%}
.arena canvas{width:100%;height:100%;display:block}
.app:not(.roomy) .hud{padding:4px 6px;gap:4px}
.app:not(.roomy) .hud .tag{font-size:10.5px;padding:0 4px}
.app:not(.roomy) .hud .hpt{font-size:11px}
/* intenção 44 */
.foeinfo.intent{height:44px;display:flex;align-items:center;gap:6px;padding:0 10px;border:0;border-top:2px solid #0d0805;border-bottom:2px solid #0d0805;cursor:pointer;text-align:left;font:inherit;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;width:100%}
.foeinfo.intent b{font-family:var(--f-title);font-weight:900;font-size:11.5px;letter-spacing:.05em;color:#ff9a7a;flex:none}
.foeinfo.intent .ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.foeinfo.intent .info{font-style:normal;color:var(--gold);flex:none;font-size:16px}
.foeinfo.intent .modtag{flex:none;font-size:11px}
/* mochila (zona principal) */
.bagzone{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 8px}
#bag{flex:none}
.aff{min-height:24px;display:flex;flex-wrap:nowrap;overflow:hidden;gap:4px;justify-content:center;align-items:center;background:none;border:0;padding:0 4px;cursor:pointer;max-width:100%;font:inherit}
.aff .aftag{font-size:11.5px;padding:0 6px;white-space:nowrap}
.aff .load{font-family:var(--f-num);font-size:12px;color:var(--muted);white-space:nowrap}
.aff .load.over{color:var(--red)}
.aff .pkdot{font-size:11px;color:var(--gold);white-space:nowrap}
/* base: loja | baú | medidor */
.base{position:relative;height:var(--baseh,116px);display:flex;flex-direction:column;justify-content:center;background:linear-gradient(#24160c,#170d07);border-top:3px solid #0d0805;box-shadow:inset 0 2px 0 #6b4428;padding:4px 8px}
.shop{display:grid;grid-template-columns:repeat(var(--n,5),var(--card,64px));justify-content:center;gap:6px;width:100%}
.shop.scroll{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:var(--card);justify-content:start;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding-bottom:2px;scrollbar-width:none}
.shop.scroll .card{scroll-snap-align:start}
.card{width:var(--card,64px);min-width:0;gap:3px;touch-action:none}
.shop.scroll .card{touch-action:pan-x}
.card .box{position:relative;width:var(--card,64px);height:var(--card,64px);aspect-ratio:auto;box-sizing:border-box;overflow:visible}
.card .box img.art{position:absolute;inset:10%;width:80%;height:80%;max-width:none;max-height:none;object-fit:contain}
.card .box img.lock{position:absolute;right:3px;top:3px;width:12px;height:auto;inset:auto 3px auto auto}
.card .price{font-size:13px;min-height:20px;padding:0 6px}
.card.pet .box{border-style:dashed}
.chestwrap{display:grid;gap:3px;justify-items:center}
.chesthead{font-size:12px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chesthead b{font-family:var(--f-title);color:var(--gold)}
#chest{--cs:var(--ccs,44px)}
.base .meter{border:0;padding:2px 2px;background:none;overflow:hidden}
.base[data-mode=battle]{justify-content:flex-start}
.bubble{position:absolute;left:8px;right:8px;bottom:calc(100% + 6px);z-index:20;background:linear-gradient(#f4e6c8,#d9c59c);color:#2a1606;font-size:13.5px;line-height:1.3;padding:6px 10px;border-radius:8px;border:2px solid #0d0805;box-shadow:0 3px 0 #000;cursor:pointer}
.bubble b{color:#7a3a10}
.bubble::after{content:"";position:absolute;bottom:-8px;left:28px;border:7px solid transparent;border-top-color:#d9c59c;border-bottom:0}
/* barra de ações 60 + área segura */
.actbar{height:60px;box-sizing:content-box;padding:0 8px env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:6px;background:linear-gradient(#1f130b,#120a05)}
.abtn{flex:none;min-width:44px;width:48px;height:52px;display:grid;place-items:center;align-content:center;gap:0;font-size:19px;line-height:1;color:var(--ink);background:linear-gradient(#545b66,#2f343c);border:2px solid #0d0f12;box-shadow:inset 0 0 0 2px #8e95a0,0 3px 0 #000;border-radius:5px;cursor:pointer;padding:0;font-family:var(--f-title);font-weight:900}
.abtn small{font-family:var(--f-num);font-weight:500;font-size:10px;letter-spacing:0;white-space:nowrap}
.abtn:disabled{opacity:.42;cursor:not-allowed}
.abtn.on{background:linear-gradient(#f2dfb6,#c9a66a);color:#2a1606;box-shadow:inset 0 0 0 2px #fff6e0,0 3px 0 #000}
.abtn.ping{box-shadow:inset 0 0 0 2px var(--gold),0 0 10px rgba(242,193,78,.7),0 3px 0 #000}
.actbar[data-mode=battle] .abtn{width:56px;font-size:17px}
.fightbtn{flex:1;min-width:0;height:52px;padding:0 6px;font-size:18px;letter-spacing:.04em}
body.lefty .actbar{flex-direction:row-reverse}
/* popover acima do objeto */
.pop{position:fixed;z-index:50;box-sizing:border-box;background:linear-gradient(#2c1a0d,#1a0f07);border:2px solid var(--tier,#6b4428);box-shadow:0 0 0 2px #0d0805,0 8px 18px rgba(0,0,0,.7);border-radius:8px;padding:8px 10px;display:grid;gap:6px;color:var(--ink)}
.pop .arrow{position:absolute;left:calc(var(--ax,50%) - 8px);bottom:-9px;width:0;height:0;border:8px solid transparent;border-top-color:var(--tier,#6b4428);border-bottom:0}
.pop[data-side=below] .arrow{bottom:auto;top:-9px;border-top:0;border-bottom:8px solid var(--tier,#6b4428)}
.pop[data-side=side] .arrow{display:none}
.pop .ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pop .ph b{font-family:var(--f-title);font-weight:900;font-size:16px}
.pop .ph span{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center;position:relative}
.pop .ph .tdots{position:static}
.pop ul{margin:0;padding-left:16px;display:grid;gap:2px;font-size:14px;line-height:1.3}
.pop ul li::marker{color:var(--gold)}
.pop .pb{display:flex;flex-wrap:wrap;gap:6px}
.pop .pb .btn{flex:1 1 auto;min-height:44px;padding:6px 8px;font-size:13px}
.pop .pb .btn.primary{font-size:14px}
/* gavetas não modais */
.drawer{position:fixed;left:50%;transform:translateX(-50%);width:min(480px,100%);box-sizing:border-box;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:45;max-height:50vh;max-height:50svh;display:flex;flex-direction:column;background:linear-gradient(#2a190d,#170d07);border-radius:12px 12px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.6);padding:4px 10px 10px}
.dhead{display:flex;align-items:center;gap:8px;min-height:44px}
.dhead b{flex:1;font-family:var(--f-title);font-weight:900;font-size:16px;color:var(--gold)}
.dhead .handle{position:absolute;left:50%;top:4px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:#6b4428}
.dbody{overflow:auto;overscroll-behavior:contain;min-height:0}
.dpane{display:grid;gap:8px}
.dpane .pets{display:flex;gap:10px;justify-content:center}
.dpane .slot{width:64px;height:64px}
.dpane .scene img{width:100%;height:96px;object-fit:cover;border-radius:6px;display:block}
.morelist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.morelist .btn{min-height:44px;font-size:13px}
#affFull table td.wrap{white-space:normal;text-align:left;font-size:12px}
/* venda: placa no canto da arena */
.sellzone{position:fixed;z-index:55;width:118px;height:64px;box-sizing:border-box;display:grid;place-items:center;align-content:center;gap:2px;background:rgba(60,14,10,.9);border:3px dashed #e0574a;border-radius:10px;color:#ffd2c8;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.6)}
.sellzone b{font-family:var(--f-title);font-weight:900;font-size:15px;letter-spacing:.05em}
.sellzone span{display:flex;align-items:center;gap:4px;font-family:var(--f-num);font-size:14px;color:var(--gold)}
.sellzone span img{height:13px}
.sellzone.hot{background:rgba(224,87,74,.95);border-style:solid;border-color:#ffd2c8;color:#fff;transform:scale(1.08)}
body.is-dragging .pop,body.is-dragging .bubble{display:none!important}
.tip{position:fixed;left:0;top:0;z-index:61;max-width:250px;pointer-events:none}
.rotfab{top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));right:12px;min-height:52px}
body.lefty .rotfab{right:auto;left:12px}
/* ficha completa ("Mais") */
.sheet{z-index:52}
.sheet .in{max-height:62vh;max-height:62svh}
.sheet .row .btn{min-height:44px}
/* modais de tela cheia com rolagem interna */
.overlay{place-items:start center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.modal{max-height:none;overflow:visible}
.modal .btn{min-height:44px}
.modal .mini{min-height:36px;min-width:36px}
.modal .two:last-child,.modal>.btn.primary:last-child{position:sticky;bottom:0;z-index:2;box-shadow:0 -10px 12px rgba(19,11,7,.95)}
.chk{min-height:44px;justify-content:flex-start}
.chk input{width:22px;height:22px}
.fld input[type=range]{width:100%;height:32px;accent-color:var(--gold)}
.toast{max-width:calc(100% - 32px);text-align:center}
/* paisagem em tela baixa: pausa + aviso */
.rotmsg{display:none}
@media (orientation:landscape) and (max-height:500px){
 .rotmsg{display:grid;place-items:center;position:fixed;inset:0;z-index:100;background:var(--bg);text-align:center;padding:24px}
 .rotmsg b{font-size:48px;color:var(--gold);display:block}
 .rotmsg p{font-family:var(--f-title);font-weight:900;font-size:20px;margin:8px 0}
 .rotmsg span{color:var(--muted)}
 .app,.drawer,.pop,.sheet{visibility:hidden}
}
@media (min-width:481px){body{background:radial-gradient(circle at 50% 30%,#21140c,#0b0705)}.app{box-shadow:0 0 0 2px #2c190d,0 0 40px #000}}
@media (prefers-reduced-motion:reduce){.sellzone.hot{transform:none}}
.abtn{position:relative;flex:1 1 0;width:auto;max-width:64px}
.abtn small{font-family:var(--f-body);font-weight:700;font-size:10.5px;letter-spacing:-.1px;margin-top:2px}
.abtn .cost{position:absolute;right:-4px;top:-6px;min-width:17px;height:17px;padding:0 3px;box-sizing:border-box;border-radius:9px;background:linear-gradient(#ffe08a,#c88a2a);color:#2a1606;font-style:normal;font-family:var(--f-num);font-size:11px;line-height:17px;text-align:center;box-shadow:0 0 0 1px #0d0805}
.abtn .cost.n{background:linear-gradient(#cfd5de,#8e95a0)}
.fightbtn{flex:1.7 1 0}
.card.dragging{opacity:.35}
#undo small{font-size:9.5px;letter-spacing:-.3px}
body.sell-hot .ghost{opacity:.5}
.rotfab{top:calc(118px + env(safe-area-inset-top,0px));bottom:auto}
/* ===== v6.2 ===== */
.pop ul li{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pop{gap:5px;padding:7px 9px}
.pop .pb .btn{min-height:44px;flex:1 1 0}
.app:not(.roomy) .hud{background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,0) 85%)}
.hud .side{display:flex;flex-wrap:wrap;align-items:center;column-gap:5px;row-gap:1px;align-content:flex-start}
.hud .side .fname,.hud .side .bar{flex-basis:100%}
.hud .side.e{justify-content:flex-end}
.app:not(.roomy) .hud .fname{font-size:12.5px}
.hud .tags{display:inline-flex;gap:3px}
.toast{display:flex;align-items:center;gap:10px;justify-content:center;pointer-events:auto}
.toast .tbtn{min-height:36px;min-width:44px;padding:0 10px;font-family:var(--f-title);font-weight:900;font-size:13px;color:#2a1606;background:linear-gradient(#ffe08a,#c88a2a);border:2px solid #0d0805;border-radius:5px;cursor:pointer}
@keyframes snapin{0%{transform:scale(1.16)}55%{transform:scale(.96)}100%{transform:scale(1)}}
.item.snap .face{animation:snapin .38s ease-out;box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(242,193,78,.8)}
@keyframes gshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.grid.shake{animation:gshake .34s ease-out}
.card .hint{position:absolute;left:3px;bottom:2px;z-index:3;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:900;color:#1a0f07;box-shadow:0 0 0 1px #0d0805,0 0 8px rgba(0,0,0,.6)}
.card .hint.up{background:linear-gradient(#bff5c4,#5cc06a)}
.card .hint.rc{background:linear-gradient(#ffe08a,#d39a2e)}
.modal #next{min-height:56px;font-size:19px}
.board{display:grid;gap:4px}
.brow{display:grid;grid-template-columns:34px 1fr auto;grid-template-rows:auto auto;column-gap:8px;align-items:center;padding:6px 8px;background:#1a0f07;border:1px solid #4a2e19;border-radius:5px}
.brow b{grid-row:span 2;font-family:var(--f-title);color:var(--gold)}
.brow span{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow small{grid-column:2;color:var(--muted);font-size:12px}
.brow em{grid-column:3;grid-row:1/3;font-style:normal;font-family:var(--f-num);font-size:16px;color:var(--gold)}
.brow.me{border-color:var(--gold);box-shadow:0 0 8px rgba(242,193,78,.4)}
.missions{display:grid;gap:8px}
.mrow2{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:8px 10px;background:#1a0f07;border:1px solid #4a2e19;border-radius:5px}
.mrow2 b{grid-column:1/3;font-size:14.5px}.mrow2.done b{color:var(--green)}
.mbar{height:8px;background:#0d0805;border-radius:4px;overflow:hidden;align-self:center}.mbar i{display:block;height:100%;background:linear-gradient(90deg,#c88a2a,#ffe08a)}
.mrow2 span{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.skin{display:grid;justify-items:center;gap:3px;padding:8px 4px;min-height:44px;background:#1a0f07;border:2px solid #4a2e19;border-radius:6px;color:var(--ink);cursor:pointer;font:inherit}
.skin.on{border-color:var(--gold);box-shadow:0 0 8px rgba(242,193,78,.5)}.skin:disabled{opacity:.45;cursor:not-allowed}
.skin small{font-size:11.5px;color:var(--muted)}
.sw{display:grid;grid-template-columns:repeat(2,16px);gap:2px}.sw i{width:16px;height:16px;border-radius:2px;background:radial-gradient(circle at 50% 35%,var(--cellhi),var(--slot));box-shadow:inset 0 0 0 1px var(--slot-edge)}
/* visuais de mochila */
:root,[data-sk=couro]{--cellhi:#2c1b0f}
body[data-skin=carvalho],[data-sk=carvalho]{--slot:#2a1a0c;--slot-edge:#8a5a2a;--cellhi:#4a2f16}
body[data-skin=geada],[data-sk=geada]{--slot:#0d1820;--slot-edge:#4a7a9a;--cellhi:#1e3442}
body[data-skin=brasa],[data-sk=brasa]{--slot:#200a06;--slot-edge:#a0401c;--cellhi:#3e160a}
body[data-skin=ouro],[data-sk=ouro]{--slot:#211808;--slot-edge:#c8962e;--cellhi:#4a3810}

[data-sk=couro]{--slot:#1f130b;--slot-edge:#5a3a20}

/* abertura */
.splash{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2a190d,#0b0705);transition:opacity .45s}
.splash>div{display:grid;justify-items:center;gap:10px}
.splash img{width:110px;height:auto;image-rendering:pixelated;animation:bob 1.6s ease-in-out infinite}
.splash .plaque{font-size:26px}
.splash small{color:var(--muted);font-size:13px}
.splash.out{opacity:0;pointer-events:none}

body.eco *,body.eco *::before,body.eco *::after{animation-duration:0s!important;animation-iteration-count:1!important;transition:none!important}
body.eco .spark{display:none}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.toast .tbtn{white-space:nowrap;flex:none}
/* ===== v7 ===== */
.coach{position:fixed;inset:0;z-index:58;pointer-events:none}
.coach .hole{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(8,5,3,.62),0 0 0 3px var(--gold),0 0 18px rgba(242,193,78,.8);transition:all .25s;animation:coachpulse 1.4s ease-in-out infinite}
@keyframes coachpulse{50%{box-shadow:0 0 0 9999px rgba(8,5,3,.62),0 0 0 5px var(--gold),0 0 26px rgba(242,193,78,1)}}
.coach .cbub{position:fixed;left:16px;right:16px;max-width:448px;margin:0 auto;pointer-events:auto;background:linear-gradient(#f4e6c8,#d9c59c);color:#2a1606;border:3px solid #0d0805;border-radius:10px;padding:10px 12px;box-shadow:0 6px 0 #000;display:grid;gap:6px}
